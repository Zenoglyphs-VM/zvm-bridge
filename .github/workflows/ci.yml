name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Linux, as most people who build this will be on.
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - name: Run uncached component tests with named JSON results
        run: go test -json -count=1 -timeout=3m ./...
      - name: Run uncached race controls with named JSON results
        run: go test -race -json -count=1 -timeout=5m ./...
